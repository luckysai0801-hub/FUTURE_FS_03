<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Announcements – Skyline Residency</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css?v=2">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
</head>
<body class="admin-body">

<div class="admin-layout">
    
    <!-- Dynamic Admin Sidebar Container -->
    <div id="app-admin-sidebar"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <div class="topbar">
            <div class="topbar-left">
                <h1>Society Notice Board Broadcasts</h1>
                <p>Post announcements to the resident public portal and manage active broadcasts.</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 1.75rem;">
            
            <!-- Create Form Card -->
            <div class="card" style="height: fit-content;">
                <h3 style="font-size: 1.15rem; color: var(--primary); margin-bottom: 1.25rem;">
                    <i class="fas fa-bullhorn"></i> Post New Broadcast
                </h3>

                <form id="createAnnouncementForm">
                    <div class="form-group">
                        <label class="form-label" for="announcementTitle">Broadcast Title</label>
                        <input type="text" id="announcementTitle" class="form-control" placeholder="e.g. Scheduled Water Tank Sanitization" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="announcementCategory">Category</label>
                        <select id="announcementCategory" class="form-select">
                            <option value="Maintenance Alert">Maintenance Alert</option>
                            <option value="General Notice" selected>General Notice</option>
                            <option value="Sanitation">Sanitation</option>
                            <option value="Security Alert">Security Alert</option>
                            <option value="Meeting">Meeting</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="announcementPriority">Priority</label>
                        <select id="announcementPriority" class="form-select">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="announcementContent">Notice Message Content</label>
                        <textarea id="announcementContent" class="form-control" rows="4" placeholder="Enter notice details for residents..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-paper-plane"></i> Broadcast Notice Now
                    </button>
                </form>
            </div>

            <!-- Active Notices Table Card -->
            <div class="table-card" style="margin-bottom: 0;">
                <div class="table-header">
                    <h3 style="font-size: 1.15rem; color: var(--primary);">
                        <i class="fas fa-list"></i> Active Society Notices
                    </h3>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Posted Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminAnnouncementsBody">
                            <tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-muted);">Loading active broadcasts...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>
</div>

<!-- Dynamic Footer Container -->
<div id="app-footer"></div>

<!-- Client Scripts -->
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
