<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Complaints Queue – Skyline Residency</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css?v=2">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
</head>
<body class="admin-body">

<div class="admin-layout">
    
    <!-- Dynamic Admin Sidebar Container -->
    <div id="app-admin-sidebar"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <div class="topbar">
            <div class="topbar-left">
                <h1>Maintenance Dispatch Queue</h1>
                <p>Filter, search, update status, and manage all resident complaint tickets.</p>
            </div>
            <a href="/api/admin/export/csv" class="btn btn-primary btn-sm" target="_blank">
                <i class="fas fa-file-csv"></i> Download CSV Export
            </a>
        </div>

        <!-- Search & Multi-Filter Bar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                <div style="flex: 1.5; min-width: 240px; position: relative;">
                    <input type="text" id="searchQuery" class="form-control" placeholder="Search by Ticket ID, Resident Name, Flat..." style="padding-left: 2.5rem;">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                </div>

                <div style="flex: 1; min-width: 180px;">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div style="flex: 1; min-width: 180px;">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                        <option value="Water Leakage">Water Leakage</option>
                        <option value="Electrical Issue">Electrical Issue</option>
                        <option value="Lift Problem">Lift Problem</option>
                        <option value="Parking Issue">Parking Issue</option>
                        <option value="Security Complaint">Security Complaint</option>
                        <option value="Housekeeping">Housekeeping</option>
                        <option value="Garbage Collection">Garbage Collection</option>
                        <option value="Water Supply">Water Supply</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Garden Maintenance">Garden Maintenance</option>
                        <option value="Street Lighting">Street Lighting</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Resident & Unit</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Date Filed</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                        <tr><td colspan="7" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">Loading ticket queue...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- Status Update Modal -->
<div id="statusModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 style="font-size: 1.15rem; color: var(--primary);">
                <i class="fas fa-pen-to-square"></i> Update Ticket Status & Remarks
            </h3>
            <button onclick="closeModal()" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="modalTicketId">
            <div class="form-group">
                <label class="form-label" for="modalStatus">Target Status</label>
                <select id="modalStatus" class="form-select">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="modalRemarks">Management Remarks / Technician Notes</label>
                <textarea id="modalRemarks" class="form-control" rows="3" placeholder="e.g. Assigned Otis Lift Senior Technician. Work order #902 created."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closeModal()" class="btn btn-outline-primary">Cancel</button>
            <button onclick="submitStatusUpdate()" class="btn btn-primary">Save Changes</button>
        </div>
    </div>
</div>

<!-- Dynamic Footer Container -->
<div id="app-footer"></div>

<!-- Client Scripts -->
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
