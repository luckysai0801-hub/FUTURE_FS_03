<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Ticket Deep-Dive – Skyline Residency</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/complaints.css">
</head>
<body class="admin-body">

<div class="admin-layout">
    
    <!-- Dynamic Admin Sidebar Container -->
    <div id="app-admin-sidebar"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <div class="topbar">
            <div>
                <a href="/admin-complaints.html" style="color: var(--primary); font-weight: 600; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Return to Queue
                </a>
                <h1 style="display: flex; align-items: center; gap: 0.75rem;">
                    Ticket <span id="detailTicketId" style="font-family: monospace; color: var(--primary);">CMP-XXXX</span>
                </h1>
            </div>
            <span id="detailStatusBadge" class="badge badge-pending">Pending</span>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1.1fr; gap: 1.75rem;">
            
            <!-- Left Info Panel -->
            <div>
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 1rem; margin-bottom: 1.25rem;">
                        <span style="font-size: 0.78rem; color: var(--primary); font-weight: 800; text-transform: uppercase;">CATEGORY</span>
                        <h3 id="detailTitle" style="font-size: 1.3rem; color: var(--text-main); margin-top: 0.2rem;">--</h3>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">RESIDENT DESCRIPTION</label>
                        <p id="detailDescription" style="background: #F8FAFC; padding: 1.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-light); color: var(--text-body); line-height: 1.7;"></p>
                    </div>

                    <div class="form-grid">
                        <div>
                            <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; display: block;">RESIDENT PROFILE</span>
                            <strong id="detailResident" style="color: var(--text-main);">--</strong>
                        </div>
                        <div>
                            <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; display: block;">CONTACT DETAILS</span>
                            <span id="detailContact" style="font-weight: 600; color: var(--text-body);">--</span>
                        </div>
                        <div>
                            <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; display: block;">CATEGORY</span>
                            <strong id="detailCategory" style="color: var(--primary);">--</strong>
                        </div>
                        <div>
                            <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; display: block;">DATE SUBMITTED</span>
                            <span id="detailDate" style="font-weight: 600;">--</span>
                        </div>
                    </div>

                    <div id="imageWrap" style="display: none; margin-top: 1.5rem; border-top: 1px solid var(--border-light); padding-top: 1.25rem;">
                        <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 0.5rem;">ATTACHED PHOTO EVIDENCE</span>
                        <a id="detailImageLink" href="#" target="_blank">
                            <img id="detailImage" src="" alt="Attachment" style="max-height: 220px; border-radius: var(--radius-sm); border: 1px solid var(--border-light);">
                        </a>
                    </div>
                </div>

                <!-- Timeline Audit History -->
                <div class="card">
                    <h3 style="font-size: 1.15rem; color: var(--primary); margin-bottom: 1rem;">
                        <i class="fas fa-history"></i> Audit Trail History
                    </h3>
                    <div class="timeline" id="detailTimeline"></div>
                </div>
            </div>

            <!-- Right Dispatch & Notes Control Panel -->
            <div>
                <div class="card">
                    <h3 style="font-size: 1.15rem; color: var(--primary); margin-bottom: 1.25rem;">
                        <i class="fas fa-user-gear"></i> Dispatch & Management Notes
                    </h3>

                    <div class="form-group">
                        <label class="form-label" for="assignedToInput">Assigned Staff / Vendor</label>
                        <input type="text" id="assignedToInput" class="form-control" placeholder="e.g. Otis Senior Lift Engineer">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="adminRemarksInput">Management Internal Remarks</label>
                        <textarea id="adminRemarksInput" class="form-control" rows="4" placeholder="Enter notes or updates for resident visibility..."></textarea>
                    </div>

                    <button onclick="saveTicketDetails()" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-floppy-disk"></i> Save Dispatch Notes
                    </button>
                </div>
            </div>

        </div>

    </main>
</div>

<!-- Dynamic Footer Container -->
<div id="app-footer"></div>

<!-- Client Scripts -->
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
