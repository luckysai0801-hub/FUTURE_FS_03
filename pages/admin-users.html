<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Directory – Skyline Residency</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css?v=2">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
</head>
<body class="admin-body">

<div class="admin-layout">
    
    <!-- Dynamic Admin Sidebar Container -->
    <div id="app-admin-sidebar"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <div class="topbar">
            <div class="topbar-left">
                <h1>Resident Directory</h1>
                <p>View registered apartment flat units, contact details, and ticket history.</p>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h3 style="font-size: 1.15rem; color: var(--primary);">
                    <i class="fas fa-users-gear"></i> Active Resident Profiles
                </h3>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Resident Name</th>
                            <th>Block & Flat Unit</th>
                            <th>Mobile Phone</th>
                            <th>Email Address</th>
                            <th>Tickets Filed</th>
                            <th>First Activity</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="6" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">Loading resident directory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- Dynamic Footer Container -->
<div id="app-footer"></div>

<!-- Client Scripts -->
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
