<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Residency – Official Maintenance Audit Report</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; padding: 2rem; color: #0F172A; background: #FFFFFF; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2563EB; padding-bottom: 1rem; margin-bottom: 2rem; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #2563EB; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-size: 0.88rem; }
        th { background: #F8FAFC; padding: 10px; border: 1px solid #E2E8F0; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 10px; border: 1px solid #E2E8F0; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="no-print" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; background: #EFF6FF; padding: 1rem; border-radius: 8px;">
    <span><i class="fas fa-print"></i> Ready to Print / Export to PDF</span>
    <div>
        <a href="/admin-reports.html" style="margin-right: 1rem; color: #2563EB; text-decoration: none; font-weight: 600;">Return to Reports</a>
        <button onclick="window.print()" style="background: #2563EB; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; cursor: pointer; font-weight: 600;">
            <i class="fas fa-print"></i> Print Document / Save PDF
        </button>
    </div>
</div>

<div class="header">
    <div class="logo">
        <i class="fas fa-building-user"></i> Skyline Residency Association
    </div>
    <div style="text-align: right;">
        <h3 style="margin: 0; font-size: 1.1rem; color: #0F172A;">Maintenance Audit Report</h3>
        <span id="reportGeneratedDate" style="font-size: 0.8rem; color: #64748B;">Generated on: ${new Date().toLocaleString('en-IN')}</span>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>Ticket ID</th>
            <th>Resident Name</th>
            <th>Issue Title</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Submitted Date</th>
        </tr>
    </thead>
    <tbody id="pdfTableBody">
        <tr><td colspan="7" style="text-align: center;">Loading audit records...</td></tr>
    </tbody>
</table>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/admin/export/pdf-data');
        const data = await res.json();

        if (data.success && data.complaints) {
            document.getElementById('reportGeneratedDate').innerText = `Generated on: ${data.generatedAt || new Date().toLocaleString('en-IN')}`;
            const tbody = document.getElementById('pdfTableBody');
            tbody.innerHTML = data.complaints.map(c => `
                <tr>
                    <td style="font-family: monospace; font-weight: 700;">${c.complaint_id}</td>
                    <td>${c.resident_name}</td>
                    <td>${c.title}</td>
                    <td>${c.category}</td>
                    <td><strong>${c.priority}</strong></td>
                    <td>${c.status}</td>
                    <td>${c.submitted_date}</td>
                </tr>
            `).join('');
        }
    } catch (err) {
        console.error('PDF Data Error:', err);
    }
});
</script>
</body>
</html>
