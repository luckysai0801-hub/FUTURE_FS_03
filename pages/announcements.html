<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Notice Board – Skyline Residency</title>
    <meta name="description" content="Official Announcements & Notice Board for Skyline Residency Society Association. Water supply alerts, maintenance schedules, and meeting notices.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

<!-- Dynamic Navbar Container -->
<div id="app-navbar"></div>

<main class="main-content" style="padding: 3.5rem 0 5rem; background: var(--bg);">
    <div class="container">
        
        <div style="text-align: center; margin-bottom: 3rem;">
            <span class="hero-badge">
                <i class="fas fa-bullhorn"></i> Official Notice Board
            </span>
            <h1 style="font-size: 2.4rem; color: var(--text-main); margin-bottom: 0.5rem;">Society Broadcast Notices</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto; font-size: 1.05rem;">
                Stay updated with scheduled maintenance alerts, society general body meetings, and sanitation drives.
            </p>
        </div>

        <div id="announcementsList" class="grid-3">
            <div class="card" style="text-align: center; grid-column: 1 / -1; padding: 3rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary); margin-bottom: 1rem;"></i>
                <p style="color: var(--text-muted);">Loading society notices...</p>
            </div>
        </div>

    </div>
</main>

<!-- Dynamic Footer Container -->
<div id="app-footer"></div>

<!-- Client Scripts -->
<script src="/js/components.js"></script>
<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const listElem = document.getElementById('announcementsList');
    if (!listElem) return;

    try {
        const res = await fetch('/api/announcements');
        const data = await res.json();

        if (data.success && data.announcements && data.announcements.length > 0) {
            listElem.innerHTML = data.announcements.map(a => `
                <div class="card reveal" style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <span style="background: var(--primary-light); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">
                                <i class="fas fa-tag"></i> ${a.category || 'General Notice'}
                            </span>
                            <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 600;">
                                ${new Date(a.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}
                            </span>
                        </div>
                        <h3 style="font-size: 1.15rem; color: var(--text-main); margin-bottom: 0.75rem;">${a.title}</h3>
                        <p style="color: var(--text-body); font-size: 0.9rem; line-height: 1.6;">${a.content}</p>
                    </div>
                    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
                        <span><i class="fas fa-user-shield"></i> Posted by ${a.author_name || 'Society Admin'}</span>
                        <span style="font-weight: 700; color: ${a.priority === 'High' ? '#EF4444' : (a.priority === 'Medium' ? '#F59E0B' : '#10B981')};">
                            ${a.priority || 'Medium'} Priority
                        </span>
                    </div>
                </div>
            `).join('');
        } else {
            listElem.innerHTML = `
                <div class="card" style="text-align: center; grid-column: 1 / -1; padding: 3rem;">
                    <i class="fas fa-bullhorn" style="font-size: 2.5rem; color: var(--text-light); margin-bottom: 1rem;"></i>
                    <h3 style="font-size: 1.2rem; color: var(--text-main); margin-bottom: 0.5rem;">No Active Notices Posted</h3>
                    <p style="color: var(--text-muted);">Check back later for official society broadcasts and maintenance alerts.</p>
                </div>
            `;
        }
    } catch (err) {
        console.error('Fetch Announcements Error:', err);
        listElem.innerHTML = `
            <div class="card" style="text-align: center; grid-column: 1 / -1; padding: 3rem;">
                <p style="color: #EF4444; font-weight: 600;">Failed to load announcements from server.</p>
            </div>
        `;
    }
});
</script>
</body>
</html>
